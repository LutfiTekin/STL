<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STL - Safe To Leave?</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #0a192f; /* Fallback midnight blue */
            background-image: url('backgrounds/leipzig.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.45);
            padding: 3rem;
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            max-width: 420px;
            width: 90%;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        h1 { color: #000; margin-top: 0; }
        .status-box {
            font-size: 2rem;
            margin: 1.5rem 0;
            padding: 1.2rem;
            border-radius: 12px;
            font-weight: 900;
            letter-spacing: 2px;
        }
        .safe { background-color: rgba(40, 167, 69, 0.2); color: #155724; border: 2px solid #28a745; }
        .not-safe { background-color: rgba(220, 53, 69, 0.1); color: #721c24; border: 2px solid #dc3545; }
        .time { font-size: 1.2rem; color: #000; margin-top: 0.5rem; }
        .refresh-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0,123,255,0.3);
        }
        .refresh-btn:hover { 
            background-color: #0056b3;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,123,255,0.4);
        }
        #message { font-weight: 500; color: #222; }
        #upcoming li { font-weight: 500; color: #111 !important; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Safe To Leave?</h1>
        <div id="status" class="status-box">Checking...</div>
        <div id="countdown" style="font-size: 2.5rem; font-weight: bold; color: #e44d26; margin-bottom: 1rem; display: none;">00:00</div>
        <div id="message" style="margin-bottom: 1rem; color: #555;"></div>
        <div id="upcoming" style="margin-bottom: 1.5rem; text-align: left; padding: 0 1rem;">
            <strong style="display: block; margin-bottom: 0.5rem;">Next 3 Trams:</strong>
            <ul id="tram-list" style="list-style: none; padding: 0; margin: 0;">
            </ul>
        </div>
        <button class="refresh-btn" onclick="fetchStatus()">Refresh</button>
    </div>

    <script>
        let nextTramTime = null;
        let countdownInterval = null;

        function parseTime(timeStr) {
            const [h, m, s] = timeStr.split(':').map(Number);
            const now = new Date();
            const target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, s || 0);
            
            // Handle cross-midnight if necessary (though usually handled by API)
            if (target < now && now.getHours() > 20 && h < 4) {
                target.setDate(target.getDate() + 1);
            }
            return target;
        }

        function updateCountdown() {
            if (!nextTramTime) return;

            const now = new Date();
            const diff = nextTramTime - now;
            const countdownEl = document.getElementById('countdown');

            if (diff <= 0) {
                countdownEl.style.display = 'none';
                clearInterval(countdownInterval);
                fetchStatus();
                return;
            }

            const minutesUntil = diff / 1000 / 60;
            
            if (minutesUntil <= 5) {
                countdownEl.style.display = 'block';
                const mins = Math.floor(diff / 1000 / 60);
                const secs = Math.floor((diff / 1000) % 60);
                countdownEl.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            } else {
                countdownEl.style.display = 'none';
            }
        }

        async function fetchStatus() {
            const statusEl = document.getElementById('status');
            const messageEl = document.getElementById('message');
            const tramListEl = document.getElementById('tram-list');
            const countdownEl = document.getElementById('countdown');
            
            statusEl.innerText = "Checking...";
            statusEl.className = "status-box";
            messageEl.innerText = "";
            tramListEl.innerHTML = "";
            countdownEl.style.display = 'none';

            try {
                const response = await fetch('/api/v1/tram-status');
                const data = await response.json();
                
                if (data.safeToLeave) {
                    statusEl.innerText = "YES";
                    statusEl.classList.add('safe');
                } else {
                    statusEl.innerText = "NO";
                    statusEl.classList.add('not-safe');
                }
                
                messageEl.innerText = data.message;

                if (data.upcomingDepartures && data.upcomingDepartures.length > 0) {
                    nextTramTime = parseTime(data.upcomingDepartures[0]);
                    
                    data.upcomingDepartures.forEach(time => {
                        const li = document.createElement('li');
                        // Remove seconds part (HH:MM:SS -> HH:MM)
                        const formattedTime = time.split(':').slice(0, 2).join(':');
                        li.innerText = `• ${formattedTime}`;
                        li.style.fontSize = "1.1rem";
                        li.style.color = "#444";
                        li.style.marginBottom = "0.3rem";
                        tramListEl.appendChild(li);
                    });

                    if (countdownInterval) clearInterval(countdownInterval);
                    countdownInterval = setInterval(updateCountdown, 1000);
                    updateCountdown();
                } else {
                    nextTramTime = null;
                    const li = document.createElement('li');
                    li.innerText = "No upcoming trams found.";
                    tramListEl.appendChild(li);
                }
            } catch (error) {
                statusEl.innerText = "Error";
                messageEl.innerText = "Failed to fetch data from server.";
            }
        }

        fetchStatus();
        // Refresh every minute
        setInterval(fetchStatus, 60000);
    </script>
</body>
</html>
