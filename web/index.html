<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STL - Safe To Leave?</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #333; }
        .status-box {
            font-size: 1.5rem;
            margin: 1.5rem 0;
            padding: 1rem;
            border-radius: 8px;
            font-weight: bold;
        }
        .safe { background-color: #d4edda; color: #155724; }
        .not-safe { background-color: #f8d7da; color: #721c24; }
        .time { font-size: 1.2rem; color: #666; margin-top: 0.5rem; }
        .refresh-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s;
        }
        .refresh-btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Safe To Leave?</h1>
        <div id="status" class="status-box">Checking...</div>
        <div id="message" style="margin-bottom: 1rem; color: #555;"></div>
        <div id="upcoming" style="margin-bottom: 1.5rem; text-align: left; padding: 0 1rem;">
            <strong style="display: block; margin-bottom: 0.5rem;">Next 3 Trams:</strong>
            <ul id="tram-list" style="list-style: none; padding: 0; margin: 0;">
            </ul>
        </div>
        <button class="refresh-btn" onclick="fetchStatus()">Refresh</button>
    </div>

    <script>
        async function fetchStatus() {
            const statusEl = document.getElementById('status');
            const messageEl = document.getElementById('message');
            const tramListEl = document.getElementById('tram-list');
            
            statusEl.innerText = "Checking...";
            statusEl.className = "status-box";
            messageEl.innerText = "";
            tramListEl.innerHTML = "";

            try {
                const response = await fetch('/api/v1/tram-status');
                const data = await response.json();
                
                if (data.safeToLeave) {
                    statusEl.innerText = "YES";
                    statusEl.classList.add('safe');
                } else {
                    statusEl.innerText = "NO";
                    statusEl.classList.add('not-safe');
                }
                
                messageEl.innerText = data.message;

                if (data.upcomingDepartures && data.upcomingDepartures.length > 0) {
                    data.upcomingDepartures.forEach(time => {
                        const li = document.createElement('li');
                        li.innerText = `• ${time}`;
                        li.style.fontSize = "1.1rem";
                        li.style.color = "#444";
                        li.style.marginBottom = "0.3rem";
                        tramListEl.appendChild(li);
                    });
                } else {
                    const li = document.createElement('li');
                    li.innerText = "No upcoming trams found.";
                    tramListEl.appendChild(li);
                }
            } catch (error) {
                statusEl.innerText = "Error";
                messageEl.innerText = "Failed to fetch data from server.";
            }
        }

        fetchStatus();
        // Refresh every minute
        setInterval(fetchStatus, 60000);
    </script>
</body>
</html>
